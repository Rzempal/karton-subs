<svg width="108" height="108" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="bg-grad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#081428"/>
            <stop offset="0.45" stop-color="#0F2A5C"/>
            <stop offset="1" stop-color="#1A4080"/>
        </linearGradient>
    </defs>
    <rect width="108" height="108" fill="url(#bg-grad)"/>


    <defs>
        <mask id="cube-mask">
            <!-- White = opaque cube faces -->
            <path d="M3 13.1a2 2 0 0 0-1 1.76v3.24a2 2 0 0 0 .969 1.78L6 21.7a2 2 0 0 0 2.03.01L11 19.9a2 2 0 0 0 1-1.76V14.9a2 2 0 0 0-.97-1.78L8 11.3a2 2 0 0 0-2.03-.01z" fill="white" transform="translate(24,20) scale(2.5)"/>
            <path d="M11.7 14.2 L7 17 L2.3 14.2Z" fill="white" transform="translate(24,20) scale(2.5)"/>
            <!-- Black = transparent edge cuts -->
            <path d="M3 13.1a2 2 0 0 0-1 1.76v3.24a2 2 0 0 0 .969 1.78L6 21.7a2 2 0 0 0 2.03.01L11 19.9a2 2 0 0 0 1-1.76V14.9a2 2 0 0 0-.97-1.78L8 11.3a2 2 0 0 0-2.03-.01z" stroke="black" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(24,20) scale(2.5)"/>
            <path d="M11.7 14.2 7 17l-4.7-2.8" stroke="black" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(24,20) scale(2.5)"/>
            <path d="M7 17v5" stroke="black" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(24,20) scale(2.5)"/>
        </mask>
    </defs>

    <!-- Frame: arrows + broken square arms (white) -->
    <g transform="translate(24,20) scale(2.5)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 9V7a2 2 0 0 0-2-2h-6"/>
        <path d="m15 2-3 3 3 3"/>
        <path d="M8 5H6a2 2 0 0 0-2 2v1.5"/>
        <path d="M20 13v5a2 2 0 0 1-2 2H14.5"/>
    </g>

    <!-- Cube: cardboard fill with transparent edge mask -->
    <g mask="url(#cube-mask)">
        <rect width="108" height="108" fill="#D4A574"/>
    </g>

</svg>
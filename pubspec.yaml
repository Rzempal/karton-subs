name: karton_subs
description: "Karton na subskrypcje — mobilny tracker subskrypcji"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # State management
  provider: ^6.1.2

  # UI
  lucide_icons: ^0.257.0
  fl_chart: ^0.70.2
  intl: ^0.19.0

  # Security / Backup
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.2.4

  # Updates
  ota_update: ^7.0.1

  # PDF
  pdf: ^3.11.2
  printing: ^5.13.5

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
